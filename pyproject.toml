[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charon"]

[project]
name = "clickhouse-charon"
version = "1.0.2"
description = "CHaron — ClickHouse migration tool with CLI + web dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
    "requests>=2.32",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
charon = "charon.cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2",
    "types-PyYAML>=6",
    "python-semantic-release>=9",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["charon/__init__.py:__version__"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "uv build"
upload_to_pypi = false
upload_to_release = true
commit_message = "chore(release): v{version} [skip ci]"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
