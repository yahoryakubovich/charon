site_name: CHaron
site_description: ClickHouse database copier — CLI + web dashboard
site_url: https://your-org.github.io/charon
repo_url: https://github.com/your-org/charon
repo_name: your-org/charon

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Configuration: configuration.md
  - CLI Reference: cli.md
  - Web Dashboard: web.md
